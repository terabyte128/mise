# use vi mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D

set-option -g pane-active-border-style "bg=green fg=green"

# the terminal that is used INSIDE of tmux
set-option default-terminal "tmux-256color"

# terminal features that the terminal OUTSIDE of tmux supports
set-option 'terminal-features[100]' 'xterm-256color:RGB:extkeys'

# for nested terminals, pass through tmux features
set-option 'terminal-features[101]' 'tmux-256color:RGB:extkeys'

set-option -g allow-rename off  # don't allow programs to rename windows
set-option -g extended-keys on # forward extended keys to programs when they request it

# open new windows and splits in current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# use vim keys for moving around panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use vim keys for resizing panes, when prefixed by the prefix key
bind-key -r -T prefix C-k resize-pane -U
bind-key -r -T prefix C-j resize-pane -D
bind-key -r -T prefix C-h resize-pane -L
bind-key -r -T prefix C-l resize-pane -R

# use b for the prefix key
set-option -g prefix C-b

# shorter Esc timeout since I don't use it as a prefix and it makes other
# things that respond to Esc behave weirdly
set-option escape-time 10
