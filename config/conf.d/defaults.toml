[bootstrap.macos.defaults]
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { TrackpadRightClick = true }

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true    # automatically hide and show
autohide-delay = 0 # remove the auto-hiding delay
showhidden = true  # Make Dock icons of hidden applications translucent

[bootstrap.macos.defaults."com.apple.finder"]
_FXShowPosixPathInTitle = true         # display full POSIX path as window title
FXEnableExtensionChangeWarning = false # disable the warning when changing a file extension
FXPreferredViewStyle = "clmv"          # use column view in all Finder windows
QLEnableTextSelection = true           # allow text selection in Quick Look
ShowPathbar = true
ShowStatusBar = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleKeyboardUIMode = 3                   # Keyboard - Enable keyboard access for all controls.
ApplePressAndHoldEnabled = false          # Keyboard - don't show accented characters when pressing & holding
AppleShowAllExtensions = true             # Finder - Show filename extensions.
InitialKeyRepeat = 25                     # Keyboard - Deplay before repeating, in 1/60 second intervals, after the first keypress
KeyRepeat = 3                             # Keyboard - Deplay before repeating, in 1/60 second intervals, after being held down
NSDisableAutomaticTermination = true      # System - Disable automatic termination of inactive apps.
NSDocumentSaveNewDocumentsToCloud = false # iCloud - Save to disk by default.
NSNavPanelExpandedStateForSaveMode = true # System - Expand save panel by default.
NSQuitAlwaysKeepsWindows = false          # System - Disable window resume system-wide.
NSWindowResizeTime = 0.001                # System - Increase window resize speed for Cocoa applications.
PMPrintingExpandedStateForPrint = true    # Printer - Expand print panel by default.
WebKitDeveloperExtras = true              # Safari - Add a context menu item for showing the Web Inspector in web views.

[bootstrap.macos.defaults."com.apple.TextEdit"]
PlainTextEncoding = 4
PlainTextEncodingForWrite = 4
RichText = 0
