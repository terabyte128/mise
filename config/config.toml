[bootstrap.services.mise-history]
builtin = "history-watch"

[history.origin]
url = "git@github.com:terabyte128/mise.git"
branch = "main"

[settings.history]
sync = "manual"

[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/wezterm" = { mode = "track" }
"~/.gdbinit" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.zsh" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0

[bootstrap.macos.defaults]
"com.apple.dock" = { showhidden = true }
