[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:luarocks" = "latest"
"apt:zsh" = "latest"

[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/opencode" = {}
"~/.config/wezterm" = { mode = "track" }
"~/.gdbinit" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.zsh" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

[tools]
fzf = "latest"
neovim = "latest"
node = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
python = "3.12"
ripgrep = "latest"
ruff = "latest"
uv = "latest"
