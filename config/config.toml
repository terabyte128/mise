[bootstrap.services.mise-history]
builtin = "history-watch"

[history.origin]
url = "git@github.com:terabyte128/mise.git"
branch = "main"

[settings.history]
sync = "manual"

[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/wezterm" = { mode = "track" }
"~/.gdbinit" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.zsh" = { mode = "track" }
"~/.zshrc" = { mode = "track" }


[bootstrap.macos.defaults."com.apple.dock"]
showhidden = true # Make Dock icons of hidden applications translucent

[bootstrap.macos.defaults."com.apple.finder"]
FXEnableExtensionChangeWarning = false # disable the warning when changing a file extension
ShowPathbar = true
ShowStatusBar = true
_FXShowPosixPathInTitle = true         # display full POSIX path as window title
FXPreferredViewStyle = "clmv"          # use column view in all Finder windows
QLEnableTextSelection = true           # allow text selection in Quick Look
