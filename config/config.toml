[bootstrap.services.mise-history]
builtin = "history-watch"

[history.origin]
url = "git@github.com:terabyte128/mise.git"
branch = "main"

[settings.history]
sync = "manual"

[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/wezterm" = { mode = "track" }
"~/.gdbinit" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.zsh" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0

[bootstrap.macos.finder]
show_extensions_warning = false
show_pathbar = true
show_status_bar = true

[bootstrap.macos.defaults."com.apple.dock"]
"com.apple.dock" = { showhidden = true } # Make Dock icons of hidden applications translucent
